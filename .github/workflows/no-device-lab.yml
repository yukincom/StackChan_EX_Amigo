name: No-device maintenance lab

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      STACKCHAN_SKIP_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch existing firmware JSON dependency for host contract tests
        uses: actions/checkout@v4
        with:
          repository: bblanchon/ArduinoJson
          ref: v7.4.3
          path: firmware/.pio/libdeps/m5stack-cores3/ArduinoJson
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
      - name: Bootstrap hash-verified pip and secure uv
        run: python tools/bootstrap.py
      - name: Verify lockfile
        run: .bootstrap-venv/bin/uv lock --check --no-python-downloads
      - name: Install core and test dependencies only
        run: .bootstrap-venv/bin/uv sync --frozen --no-python-downloads --group test
      - name: Compile Python sources
        run: .bootstrap-venv/bin/uv run --frozen --no-sync python -m compileall -q server tools tests
      - name: Run no-device tests
        run: .bootstrap-venv/bin/uv run --frozen --no-sync pytest -q
      - name: Run standalone smoke scenario
        run: .bootstrap-venv/bin/uv run --frozen --no-sync python -m tools.stackchan_lab smoke --repo . --allow-known-gaps
