[project]
name = "stackchan-ex-amigo"
version = "0.1.0"
description = "Local server and no-device maintenance lab for StackChan_EX_Amigo"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "APScheduler==3.11.2",
  "Flask==3.1.3",
  "Werkzeug==3.1.8",
  "google-genai==1.72.0",
  "huggingface-hub==1.12.0",
  "jpholiday==1.0.3",
  "openai==2.31.0",
  "python-dotenv==1.2.2",
  "requests==2.33.1",
]

[project.optional-dependencies]
voice = [
  "kokoro==0.9.4",
  "numpy==2.4.4",
  "soundfile==0.13.1",
]
mlx = [
  "mlx-lm==0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-vlm==0.4.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
test = [
  "pytest==9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["server", "."]
testpaths = ["tests"]
